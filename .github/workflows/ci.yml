name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint, Type Check, and Test
    runs-on: ubuntu-latest

    env:
      # E2E test mode - must be at job level for build-time embedding
      NEXT_PUBLIC_E2E_TEST_MODE: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject tracked Resend credentials
        run: |
          python3 -m unittest discover -s scripts -p test_check_resend_secrets.py -v
          python3 scripts/check-resend-secrets.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true  # Pre-existing type debt - don't block CI

      - name: Build application
        run: npm run build

      - name: Run unit tests
        run: npm run test:unit
        continue-on-error: true  # Some tests need STRIPE_SECRET_KEY and better mocks
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}

      - name: Run integration tests
        run: npm run test:integration
        continue-on-error: true  # Re-stabilize integration tests on Postgres/Drizzle (post-migration)

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        continue-on-error: true  # Re-stabilize E2E on Postgres/local-FS (post-migration)
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4000
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - name: Run security audit
        run: npm run test:security
        continue-on-error: true  # Don't fail on moderate vulnerabilities

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: 03-Tests/playwright-report/
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 14

  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify private environment files stay outside Docker builds
        run: bash scripts/test-docker-context.sh

      - name: Build Docker image
        run: docker build -f Dockerfile -t hustle-app:${{ github.sha }} .

      - name: Test Docker image
        run: |
          # Port 8084 + /api/healthz match the VPS-as-the-home migration
          # (Phase 2, OPS-ch2). The healthz route is dependency-free and is
          # the canonical smoke-validation gate the VPS deploy workflow
          # asserts post-deploy.
          docker run -d -p 8084:8084 --name test-app \
            -e NODE_ENV=production \
            hustle-app:${{ github.sha }}
          echo "Waiting for container startup..."
          sleep 15
          docker logs test-app || true
          curl -sf --max-time 10 http://localhost:8084/api/healthz || \
            (echo "Health check failed - container logs:" && docker logs test-app && exit 1)
          docker stop test-app
