name: Branch Protection Strategy

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Pre-merge Validation
    runs-on: ubuntu-latest

    env:
      # E2E test mode + credentials. Firebase + GCP env wires removed during
      # the VPS-as-the-home / GCP exodus (Phase 3+ rip out Firebase auth/admin;
      # Phase 8 retires the GCP project). Anything Firebase- or Vertex-related
      # that needs to be set in CI now should come from SOPS secrets the
      # canonical way, not from this file.
      NEXT_PUBLIC_E2E_TEST_MODE: 'true'
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject tracked Resend credentials
        run: |
          python3 -m unittest discover -s scripts -p test_check_resend_secrets.py -v
          python3 scripts/check-resend-secrets.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (strict)
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test:unit

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:4000

      - name: Build check
        run: npm run build
