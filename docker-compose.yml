services:
  app:
    build: .
    image: hustle:latest
    container_name: hustle-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8084
      HOSTNAME: 0.0.0.0
      TZ: America/New_York
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET required in .env}
      AUTH_SECRET: ${AUTH_SECRET:-${SESSION_SECRET}}
      AUTH_TRUST_HOST: "true"
      # Public origin for Auth.js-generated URLs (redirects, callback URLs). Without it Auth.js
      # derives the container bind address (https://0.0.0.0:8084) from HOSTNAME/PORT.
      AUTH_URL: ${AUTH_URL:-${APP_ORIGIN:-https://hustlestats.io}}
      # The Stripe checkout and billing-portal return URLs read NEXTAUTH_URL and otherwise fall back
      # to http://localhost:3000. Billing is off today (BILLING_ENABLED=false), so nothing hits that
      # yet; this keeps it from sending customers to localhost the day billing is switched on.
      NEXTAUTH_URL: ${NEXTAUTH_URL:-${APP_ORIGIN:-https://hustlestats.io}}
      DATABASE_PATH: /data/hustle.db
      UPLOADS_DIR: /data/uploads
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      APP_ORIGIN: ${APP_ORIGIN:-https://hustlestats.io}
      # Bearer token for POST /api/internal/* (the VPS trial-reminders timer). It was never listed
      # here: it reached the container only through a hand-edit on the VPS that the 2026-09-13
      # deploy overwrote, and reminders returned 401 every night after. Unset = the route fails closed.
      HUSTLE_INTERNAL_TOKEN: ${HUSTLE_INTERNAL_TOKEN:-}
      BILLING_ENABLED: ${BILLING_ENABLED:?BILLING_ENABLED must be explicitly true or false}
      # Comma-separated user IDs allowed into /api/admin/* and /dashboard/admin/*. Empty = no admins (fail closed).
      ADMIN_USER_IDS: ${ADMIN_USER_IDS:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_ID_STARTER: ${STRIPE_PRICE_ID_STARTER:-}
      STRIPE_PRICE_ID_PLUS: ${STRIPE_PRICE_ID_PLUS:-}
      STRIPE_PRICE_ID_PRO: ${STRIPE_PRICE_ID_PRO:-}
    ports:
      - "127.0.0.1:8084:8084"
    volumes:
      - hustle-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8084/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  hustle-data:
